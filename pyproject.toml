[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storystick"
version = "0.1.0"
description = "Cabinetry cut-list tooling: STEP -> parts list -> sheet-goods nesting -> cut diagrams"
requires-python = ">=3.9"
dependencies = ["pyyaml", "fpdf2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
storystick = "storystick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
