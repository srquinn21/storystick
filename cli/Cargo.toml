[package]
name = "storystick"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "storystick"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
storystick-core = { path = "../core" }
yaml_serde = "0.10.7"
